<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Tic-Tac-Toe</h1>
        <div class="message-center"></div>
      </div>
      <div class="main">
        <div class="game-board">
          <div class="cell" data-id="0"></div>
          <div class="cell" data-id="1"></div>
          <div class="cell" data-id="2"></div>
          <div class="cell" data-id="3"></div>
          <div class="cell" data-id="4"></div>
          <div class="cell" data-id="5"></div>
          <div class="cell" data-id="6"></div>
          <div class="cell" data-id="7"></div>
          <div class="cell" data-id="8"></div>
        </div>
        <div class="btn-container">
          <button class="new-game-btn" command="show-modal" commandfor="new-player-modal">
            New Game
          </button>
        </div>
      </div>
    </div>
    <dialog id="new-player-modal" closedby="none">
      <div class="modal-header">
        <h2>Who's Playing?</h2>
      </div>
      <form method="dialog" class="new-player-form">
        <div class="form-group">
          <label for="p1-name">Player One:</label>
          <input type="text" 
          autofocus
          id="p1-name" 
          name="p1-name" 
          placeholder="Name" 
          pattern="\S(.*\S)?" 
          title="Please enter a name without leading or ending spaces Example: John">
        </div>
        <div class="form-group">
          <label for="p2-name">Player Two:</label>
          <input type="text" 
          id="p2-name" 
          name="p2-name" 
          placeholder="Name" 
          pattern="\S(.*\S)?" 
          title="Please enter a name without leading or ending spaces Example: John">
        </div>
        <div class="form-btn">
          <button type="submit">Let's Play!</button>
        </div>
      </form>
    </dialog>
  </body>

</html>
